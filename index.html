



<!DOCTYPE html>
<html>
<head>
  <title>Wind Tunnel Lab</title>
  <style>
    body {
      background: #101820;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    h1 { color: #42c8ff; }
    button {
      padding: 12px;
      background: #168bd2;
      color: white;
      border: none;
      border-radius: 8px;
    }
    canvas {
      background: #eaf5ff;
      border-radius: 10px;
      max-width: 95%;
    }
  </style>
</head>
<body>
  <h1>WIND TUNNEL LAB</h1>
  <p>Design and test your cars!</p>

  <canvas id="tunnel" width="600" height="300"></canvas>
  <br><br>
  <button onclick="testWind()">Test Wind</button>

  <script>
    const canvas = document.getElementById("tunnel");
    const ctx = canvas.getContext("2d");

    function drawCar() {
      ctx.clearRect(0, 0, 600, 300);
      ctx.fillStyle = "#222";
      ctx.fillRect(180, 160, 250, 50);
      ctx.fillStyle = "#168bd2";
      ctx.fillRect(240, 120, 120, 40);
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(230, 215, 25, 0, Math.PI * 2);
      ctx.arc(390, 215, 25, 0, Math.PI * 2);
      ctx.fill();
    }

    function testWind() {
      alert("Wind tunnel activated!");
    }

    drawCar();
  </script>
</body>
</html>
